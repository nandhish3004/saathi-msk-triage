; PlatformIO Project Configuration File for Saathi MSK Triage Hub
; Target Board: ESP32 DevKit V1 (Dual MPU-6050 + INA219)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_ARDUHAL_LOG_COLORS=1

lib_deps =
    adafruit/Adafruit INA219 @ ^1.2.3
    electroniccats/MPU6050 @ ^1.3.1
