publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.34.5
  tflite_flutter: ^0.10.4
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3
